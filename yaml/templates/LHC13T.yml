# Template set LHC13T: pp at 13 TeV, tight cuts
# The (m_t, Gamma_t) points are collected from the fit inputs below
# (files_sig + files_template); see scripts/make_templates.py --check.
# Physics settings follow fortran/gg2aa/MKD_gg2aa.f.  The PDF set used for
# the 2018 files is not recorded (CT14lo, as in MKD_gg2aa.f, is assumed).
outdir: Template/LHC13T
rs: 13000.            # [GeV]
pdfset: CT14lo
mu_green: 40.       # alpha_s scale in the Green function [GeV]
etamax: 2.5
ptmin: 40.          # [GeV]
# ptratio: 0.4      # pT > 0.4 M_aa ("tight", default)
maa_min: 300.       # TMDP.py requires 300-400 GeV in 0.1 GeV steps
maa_max: 400.
maa_step: 0.1
ncall: 50000        # VEGAS calls per M_aa point
itmx: 6
fit_inputs:
  - yaml/fit/input_LHC13T.yml
  - yaml/fit/inputWidth_LHC13T.yml

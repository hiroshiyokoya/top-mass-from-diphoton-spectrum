# Template set LHC13L: pp at 13 TeV, loose cuts
# The grids below are those read by the 2018 fit inputs (fit/config/);
# tests/fit/test_config.py checks that they stay complete.
# Physics settings follow fortran/legacy/MKD_gg2aa.f.  The PDF set used for
# the 2018 files is not recorded (CT14lo, as in MKD_gg2aa.f, is assumed).
outdir: Template/LHC13L
rs: 13000.            # [GeV]
pdfset: CT14lo
mu_green: 40.       # alpha_s scale in the Green function [GeV]
etamax: 2.5
ptmin: 40.          # [GeV]
ptratio: 0.         # no pT > 0.4 M_aa cut ("loose"; inferred from the
                    # set name and the "Tight PTCUT" comments in gg2aa)
maa_min: 300.       # fit/TMDP.py requires 300-400 GeV in 0.1 GeV steps
maa_max: 400.
maa_step: 0.1
ncall: 50000        # VEGAS calls per M_aa point
itmx: 6
grids:
  # input_LHC13L.yml (33 templates)
  - masses: [160.0, 161.0, 162.0, 163.0, 164.0, 165.0, 166.0, 167.0, 168.0, 169.0, 170.0, 171.0, 171.5, 172.0, 172.5, 173.0, 173.5, 174.0, 174.5, 175.0, 176.0, 177.0, 178.0, 179.0, 180.0, 181.0, 182.0, 183.0, 184.0, 185.0, 186.0, 187.0, 188.0]
    widths: [1.5]

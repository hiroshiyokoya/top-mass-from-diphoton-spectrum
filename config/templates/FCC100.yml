# Template set FCC100: pp at 100 TeV (FCC-hh), tight cuts
# The grids below are those read by the 2018 fit inputs (fit/config/);
# tests/fit/test_config.py checks that they stay complete.
# Physics settings follow fortran/legacy/MKD_gg2aa.f.  The PDF set used for
# the 2018 files is not recorded (CT14lo, as in MKD_gg2aa.f, is assumed).
outdir: Template/FCC100
rs: 100000.            # [GeV]
pdfset: CT14lo
mu_green: 40.       # alpha_s scale in the Green function [GeV]
etamax: 2.5
ptmin: 40.          # [GeV]
# ptratio: 0.4      # pT > 0.4 M_aa ("tight", default)
maa_min: 300.       # fit/TMDP.py requires 300-400 GeV in 0.1 GeV steps
maa_max: 400.
maa_step: 0.1
ncall: 50000        # VEGAS calls per M_aa point
itmx: 6
grids:
  # input_FCC100.yml (29 templates)
  - masses: [171.6, 171.7, 171.8, 171.9, 172.0, 172.1, 172.2, 172.3, 172.4, 172.5, 172.6, 172.7, 172.8, 172.9, 173.0, 173.1, 173.2, 173.3, 173.4, 173.5, 173.6, 173.7, 173.8, 173.9, 174.0, 174.1, 174.2, 174.3, 174.4]
    widths: [1.5]
  # inputWidth_FCC100.yml (29 templates)
  - masses: [173.0]
    widths: [0.5, 0.625, 0.75, 0.875, 1.0, 1.1, 1.125, 1.2, 1.3, 1.375, 1.4, 1.5, 1.6, 1.625, 1.7, 1.8, 1.875, 1.9, 2.0, 2.125, 2.25, 2.375, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75, 4.0]
  # input2D_FCC100.yml (357 templates)
  - masses: [172.0, 172.1, 172.2, 172.3, 172.4, 172.5, 172.6, 172.7, 172.8, 172.9, 173.0, 173.1, 173.2, 173.3, 173.4, 173.5, 173.6, 173.7, 173.8, 173.9, 174.0]
    widths: [0.5, 0.625, 0.75, 0.875, 1.0, 1.125, 1.25, 1.375, 1.5, 1.625, 1.75, 1.875, 2.0, 2.125, 2.25, 2.375, 2.5]

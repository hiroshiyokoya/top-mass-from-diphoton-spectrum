# Template set HELHC27T: pp at 27 TeV (HE-LHC), tight cuts
# The grids below are those read by the 2018 fit inputs (fit/config/);
# tests/fit/test_config.py checks that they stay complete.
# Physics settings follow fortran/legacy/MKD_gg2aa.f.  The PDF set used for
# the 2018 files is not recorded (CT14lo, as in MKD_gg2aa.f, is assumed).
outdir: Template/HELHC27T
rs: 27000.            # [GeV]
pdfset: CT14lo
mu_green: 40.       # alpha_s scale in the Green function [GeV]
etamax: 2.5
ptmin: 40.          # [GeV]
# ptratio: 0.4      # pT > 0.4 M_aa ("tight", default)
maa_min: 300.       # fit/TMDP.py requires 300-400 GeV in 0.1 GeV steps
maa_max: 400.
maa_step: 0.1
ncall: 50000        # VEGAS calls per M_aa point
itmx: 6
grids:
  # input_HELHC27T.yml (27 templates)
  - masses: [170.0, 171.0, 171.5, 172.0, 172.1, 172.2, 172.3, 172.4, 172.5, 172.6, 172.7, 172.8, 172.9, 173.0, 173.1, 173.2, 173.3, 173.4, 173.5, 173.6, 173.7, 173.8, 173.9, 174.0, 174.5, 175.0, 176.0]
    widths: [1.5]
  # input2D_HELHC27T.yml (165 templates)
  - masses: [166.0, 167.0, 168.0, 169.0, 170.0, 171.0, 172.0, 173.0, 174.0, 175.0, 176.0, 177.0, 178.0, 179.0, 180.0]
    widths: [1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0]
